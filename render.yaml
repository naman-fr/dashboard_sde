services:
  - type: web
    name: analytics-api
    env: node
    buildCommand: npm install && npm run build
    startCommand: cd apps/api && npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
