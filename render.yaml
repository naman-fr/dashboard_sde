services:
  - type: web
    name: analytics-api
    runtime: node
    repo: https://github.com/naman-fr/dashboard_sde
    branch: main
    plan: free
    buildCommand: npm install && npm run build:packages && npm run build -w @analytics/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGO_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
